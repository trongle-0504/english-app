# Personal app (english-app): every agy goes through the machine-wide gate (4 agy processes for the whole WSL,
# shared with english-multi); the warm agent lets its slot go after 10 idle minutes; bounded memory; no restart loop.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
SupplementaryGroups=agyslots
Environment=PATH=/usr/local/lib/agy-gate:/usr/local/bin:/usr/bin:/bin
Environment=AGY_GATE_APP=personal
Environment=ANTIGRAVITY_WARM_IDLE_MS=600000
Environment=NODE_OPTIONS=--max-old-space-size=1024
Restart=on-failure
RestartSec=5
MemoryHigh=1600M
MemoryMax=2000M
